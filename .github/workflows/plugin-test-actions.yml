name: WordPress Plugin Tests

on:
  push:
  pull_request:

jobs:

  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.6
        env:
          #MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
      
        #image: mysql:8.0
        #env:
        #  MYSQL_ROOT_PASSWORD: root
        #  MYSQL_DATABASE: wordpress_test
        #ports:
        #  - 3306:3306
        #options: >-
        #  --health-cmd="mysqladmin ping --silent"
        #  --health-interval=10s
        #  --health-timeout=5s
        #  --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, zip
          coverage: none

      #- name: Install system dependencies
      #  run: |
      #    sudo apt-get update
      #    sudo apt-get install -y subversion mysql-client unzip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress test suite
        run: |
          mysql --host=127.0.0.1 --protocol=tcp \
          --user=root --password=root \
          -e "DROP DATABASE IF EXISTS wordpress_test; CREATE DATABASE wordpress_test;"

          echo "=== Environment ==="
          echo "TMPDIR=${TMPDIR:-/tmp}"
          echo "WP_CORE_DIR=${WP_CORE_DIR:-<not set>}"

          bash -x bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 7.1 true

          echo "=== Locate version.php ==="
          find /tmp -maxdepth 5 -name version.php -print 2>/dev/null || true

          echo "=== Verify WordPress version ==="
          test -f /tmp/wordpress/wp-includes/version.php
          grep -n 'wp_version =' /tmp/wordpress/wp-includes/version.php

      - name: Debug WordPress test versions
        run: |
          echo "=== WordPress version ==="
          grep -n "wp_version =" /tmp/wordpress/wp-includes/version.php

          echo "=== WP_Secrets_Store references ==="
          grep -R -n "WP_Secrets_Store" /tmp/wordpress /tmp/wordpress-tests-lib/includes | head -20 || true

          echo "=== PHPUnit config ==="
          ls -l phpunit.xml.dist
          grep -n "WP_TESTS_DIR" phpunit.xml.dist || true

      - name: Install PHPUnit
        run: |
          curl -sSLo phpunit.phar https://phar.phpunit.de/phpunit-9.phar
          chmod +x phpunit.phar
          sudo mv phpunit.phar /usr/local/bin/phpunit

      - name: Run PHPUnit
        run: |
          phpunit
          

